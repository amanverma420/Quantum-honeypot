services:
  - type: web
    name: quantumguard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn quantum_honeypot.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUTO_GENERATE_JWT_SECRET
        value: "true"
      - key: IS_RENDER
        value: "true"
